name: jingling
description: "鲸灵 JingLing —— 手机瘦客户端(会话、分支、流式渲染)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  audioplayers: ^6.8.1
  file_picker: ^13.3.3
  flutter:
    sdk: flutter
  flutter_markdown: ^0.7.7+1
  flutter_riverpod: ^3.5.0
  flutter_secure_storage: ^11.2.0
  http: ^1.6.0
  material_ui: ^1.1.0
  path_provider: ^2.1.6
  record: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

# M6:应用图标生成(支持自适应图标)
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/app_icon.png
  adaptive_icon_background: "#2F6FED"
  adaptive_icon_foreground: assets/icon/app_icon_foreground.png
  min_sdk_android: 21