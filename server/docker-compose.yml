services:
  jingling:
    build:
      context: .
      args:
        APT_MIRROR: ${APT_MIRROR:-mirrors.tencentyun.com}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
    restart: unless-stopped
    # 只绑本机回环,Caddy 反代进来;不直接暴露公网
    ports:
      - "127.0.0.1:3001:3000"
    env_file:
      - .env
    volumes:
      # SQLite 数据卷(含 WAL),重建容器不丢会话
      - ./data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
